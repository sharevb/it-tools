  pomodoro-timer:
    title: 番茄鍾計時器
    description: 基礎番茄鍾計時器
    texts:
      tag-import-pomodoroapp-from-app-pomodoroapp-vue: import PomodoroApp from './app/PomodoroApp.vue';
    PomodoroAbout:
      text:
        source-wikipedia: 來源：維基百科
        once-the-long-break-is-finished-return-to-step-1: 長休息結束後，返回步驟 1。
        keep-repeating-steps-1-3-but-after-your-4th-task-take-a-long-break-instead-of-a-short-break-20-30-minutes-is-common: 重複步驟 1-3，但完成第 4 項任務後，進行長休息而非短休息（通常 20-30 分鐘）。
        when-the-timer-rings-take-a-short-break-5-10-minutes-is-common: 計時器響起時，進行短休息（通常 5-10 分鐘）。
        work-on-the-task-during-that-time: 在此期間處理任務。
        decide-on-a-task-and-set-the-timer-25-minutes-is-common: 確定任務並設定計時器（通常 25 分鐘）。
        five-steps-of-the-pomodoro-technique: 番茄工作法的五個步驟
        the-pomodoro-technique-is-a-time-management-method-developed-by-francesco-cirillo-in-the-1980s-it-uses-a-timer-to-break-work-into-intervals-typically-25-minutes-in-length-separated-by-short-breaks-each-interval-is-known-as-a-pomodoro-from-the-italian-word-for-tomato-after-the-tomato-shaped-kitchen-timer-cirillo-used-as-a-university-student:
          番茄工作法是由弗朗切斯科·西里洛於 20 世紀 80 年代開發的時間管理方法。它使用計時器將工作分解為間隔（通常 25 分鐘），間隔之間有短暫休息。每個間隔稱為一個“番茄鍾”，名稱源自義大利語中的“番茄”（因西里洛大學時期使用的廚房計時器形狀類似番茄）。
        the-pomodoro-technique: 番茄工作法
