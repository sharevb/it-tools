    service:
      text:
        3-drive-failures-per-raid-7-set: 每個 RAID 7 集可容忍 3 個磁碟故障
        raid-70-requires-at-least-10-disks-with-5-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks: RAID 70 至少需要 10 個磁碟，每條帶至少 5 個。每條帶必須包含相同數量的磁碟。
        raid-70-stripes-multiple-raid-7-arrays-together-raid-7-raid-0-each-raid-7-set-can-sustain-three-drive-failures: RAID 70 將多個 RAID 7 陣列條帶化在一起（RAID 7 + RAID 0）。每個 RAID 7 集可承受 3 個磁碟故障。
        2-drive-failures-per-raid-6-set: 每個 RAID 6 集可容忍 2 個磁碟故障
        raid-60-requires-at-least-8-disks-with-4-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks: RAID 60 至少需要 8 個磁碟，每條帶至少 4 個。每條帶必須包含相同數量的磁碟。
        raid-60-stripes-multiple-raid-6-arrays-together-raid-6-raid-0-each-raid-6-set-can-sustain-two-drive-failures: RAID 60 將多個 RAID 6 陣列條帶化在一起（RAID 6 + RAID 0）。每個 RAID 6 集可承受 2 個磁碟故障。
        1-drive-failure-per-raid-5-set: 每個 RAID 5 集可容忍 1 個磁碟故障
        raid-50-requires-at-least-6-disks-with-3-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks: RAID 50 至少需要 6 個磁碟，每條帶至少 3 個。每條帶必須包含相同數量的磁碟。
        raid-50-stripes-multiple-raid-5-arrays-together-raid-5-raid-0-each-raid-5-set-can-sustain-a-single-drive-failure: RAID 50 將多個 RAID 5 陣列條帶化在一起（RAID 5 + RAID 0）。每個 RAID 5 集可承受 1 個磁碟故障。
        1-drive-failure-per-mirrored-set: 每個映象集可容忍 1 個磁碟故障
        raid-10-requires-an-even-number-of-at-least-4-disks: RAID 10 需要至少 4 個磁碟且數量為偶數
        raid-10-is-a-stripe-of-mirrors-raid-1-raid-0-each-set-of-drives-is-mirrored-and-striped-together-so-that-each-drive-in-the-set-is-fault-tolerant-within-the-group: RAID 10 是映象的條帶（RAID 1 + RAID 0）。每組磁碟被映象並條帶化，因此組內的每個磁碟都具有容錯能力。
        3-drive-failures: 3 個磁碟故障
        raid-7-requires-at-least-5-disks: RAID 7 至少需要 5 個磁碟
        raid-7-raid-tp-non-standard-is-similiar-to-raid-5-and-raid-6-but-with-a-third-parity-block-this-allows-for-a-third-disk-failure-at-the-cost-of-storage-reduction-equal-to-three-drives:
          RAID 7/RAID TP（非標準）類似於 RAID 5 和 RAID 6，但多了第三個奇偶校驗塊。這樣可容忍第三個磁碟故障，代價是儲存空間減少相當於 3 個磁碟的容量。
        2-drive-failures: 2 個磁碟故障
        raid-6-requires-at-least-4-disks: RAID 6 至少需要 4 個磁碟
        raid-6-is-similiar-to-raid-5-but-with-an-additional-parity-block-this-allows-for-an-additional-disk-failure-at-the-cost-of-storage-reduction-equal-to-two-drives: RAID 6 類似於 RAID 5，但多了一個奇偶校驗塊。這樣可多容忍一個磁碟故障，代價是儲存空間減少相當於 2 個磁碟的容量。
        1-drive-failure: 1 個磁碟故障
        raid-5-requires-at-least-3-disks: RAID 5 至少需要 3 個磁碟
        raid-5-uses-block-level-striping-with-parity-this-allows-for-fault-tolerance-with-a-storage-reduction-equal-to-one-drive-for-the-parity-information: RAID 5 使用帶奇偶校驗的塊級條帶化。這樣可實現容錯，奇偶校驗資訊會佔用相當於 1 個磁碟的儲存空間。
        raid-1-requires-at-least-1-disk: RAID 1 至少需要 1 個磁碟
        raid-1-consists-of-an-exact-copy-of-the-data-mirror-across-two-or-more-disks-the-array-will-operate-as-long-as-at-least-one-drive-is-operational: RAID 1 由跨兩個或多個磁碟的精確資料副本（映象）組成。只要至少一個磁碟正常執行，陣列即可執行。
        raid-0-requires-at-least-1-disk: RAID 0 至少需要 1 個磁碟
        raid-0-splits-data-evenly-across-2-or-more-disks-without-redunancy-or-fault-tolerance-creating-one-large-storage-space: RAID 0 將資料均勻拆分到 2 個或多個磁碟，無冗餘或容錯，建立一個大的儲存空間。
