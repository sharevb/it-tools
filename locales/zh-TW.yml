  content-fork: >
    # 關於 IT-Tools

    這個精彩的網站最初由 [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about)
    傾情打造，並由 ShareVB 進行擴充套件，彙集了開發者和 IT
    工作者所需的實用工具。如果您覺得它有用，請分享給您認為可能也會有用的人，別忘了將其新增到您的快捷方式欄中！

    IT Tools 是開源的（遵循 GPL-3.0 許可證），並且永遠免費。如果您想支援我在此分支上的工作，並鼓勵我新增更多工具或功能，請考慮透過
    [贊助我](https://www.buymeacoffee.com/sharevb) 來支援。

    ## 技術

    IT Tools 使用 Vue.js (Vue 3) 和 Naive UI 元件庫開發，並由 Vercel
    託管和持續部署。部分工具使用了第三方開源庫，您可以在程式碼庫的
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    檔案中找到完整列表。

    ## 發現錯誤？缺少工具？

    如果您需要某個工具，而該工具目前尚未提供，並且您認為它很有用，歡迎在 GitHub 程式碼庫的
    [issues](https://github.com/sharevb/it-tools/issues/new/choose) 部分提交功能請求。

    如果您發現錯誤，或者某些功能無法按預期執行，請在 GitHub 程式碼庫的
    [issues](https://github.com/sharevb/it-tools/issues/new/choose) 部分提交錯誤報告。
