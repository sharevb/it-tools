      placeholder-e-g-src-port-443-and-dst-10-0-0-1: 例如 src port 443 and dst 10.0.0.1
      title-generated-tcpdump-command: 生成的 tcpdump 命令
      tag-tcpdump-is-a-utility-commonly-installed-available-to-many-linux-distributions-to-quickly-gather-a-network-trace-packet-capture-in-short-it-s-the-wireshark-of-linux-to-gathering-packet-captures-tcpdump-is-very-versatile-with-many-switches-to-granularly-capture-what-you-need-to-dubug-network-traffic-with-options-to-output-results-via-console-file-or-wireshark-pcap:
        tcpdump 是許多 Linux 發行版中常用的實用工具，可快速收集網路跟蹤/資料包捕獲。簡而言之，它就是 Linux 上用於抓包的 Wireshark。tcpdump 功能多樣，提供大量開關，可精細捕獲除錯網路流量所需的內容，並支援透過控制檯、檔案或 Wireshark pcap 輸出結果。
      tag-this-utility-is-to-help-generate-a-tcpdump-command-using-some-of-the-more-common-switches-filters-offered-by-the-tcpdump-this-utility-is-not-encompassing-of-all-options-tcpdump-offers-a-complete-list-of-options-can-be-found-via-its-manual-nbsp:
        此工具可幫助您使用 tcpdump 提供的一些常用開關/過濾器生成 tcpdump 命令。此工具並未涵蓋 tcpdump 的所有選項，完整選項列表請參閱其手冊：&nbsp;
      tag-https-www-tcpdump-org-manpages-tcpdump-1-html: https://www.tcpdump.org/manpages/tcpdump.1.html
      tag-note: 注意：
      tag-nbsp-host-source-host-and-destination-host-can-take-multiple-entries-separate-your-entries-with-a-comma-space-or-semicolon: "&nbsp;主機、源主機和目標主機可接受多個條目，用逗號、空格或分號分隔。"
      tag-note-2: 注意 2：
      tag-nbsp-when-you-specify-a-source-src-or-destination-dst-flags-tcpdump-will-only-filter-in-that-direction-if-you-are-looking-to-capture-full-tcp-handshake-make-sure-you-use-host-vs-src-host-or-dst-host-to-see-both-request-and-response-flow:
        '&nbsp;指定源（src）或目標（dst）標誌時，tcpdump 僅會按該方向過濾。若要捕獲完整的 TCP 握手過程，請使用“host”而非“src host”或“dst host”，以同時檢視請求和回應流量。'
      tag-the-network-interface-to-capture-packets-from: 要捕獲資料包的網路介面
      tag-capture-packets-originating-from-this-host: 捕獲源自此主機的資料包
      tag-capture-packets-destined-for-this-host: 捕獲發往此主機的資料包
      tag-filter-packets-from-this-source-port: 按此源埠過濾資料包
      tag-filter-packets-going-to-this-destination-port: 按此目標埠過濾資料包
      tag-stop-capturing-after-this-number-of-packets: 捕獲指定數量的資料包後停止
      tag-n: -n
      tag-prevent-resolving-ips-to-hostnames: 不將 IP 解析為主機名稱
      tag-e: -e
      tag-display-link-layer-headers-in-output: 在輸出中顯示鏈路層頭部
