      tag-striping-only-no-redundancy-fast-but-risky-if-one-drive-fails-all-data-is-lost: 僅限條帶化。無冗餘。速度快但風險高——如果一個驅動器發生故障，所有資料都會丟失。
      tag-raid-1: RAID 1
      tag-mirroring-data-is-duplicated-across-drives-high-redundancy-low-capacity-efficiency: 映象。資料在驅動器之間複製。冗餘度高，但容量效率低。
      tag-raid-5: RAID 5
      tag-striping-with-parity-can-tolerate-one-drive-failure-balanced-speed-and-redundancy: 帶奇偶校驗的條帶化。可容忍一個驅動器故障。速度和冗餘均衡。
      tag-raid-6: RAID 6
      tag-double-parity-can-survive-two-drive-failures: 雙重奇偶校驗。可承受兩個驅動器故障。
      tag-raid-10: RAID 10
      tag-mirrored-pairs-striped-together-high-performance-and-redundancy: 映象對再條帶化。高效能、高冗餘。
      tag-raid-z1-z2-z3: RAID-Z1/Z2/Z3
      tag-zfs-based-raid-levels-with-single-double-or-triple-parity-designed-for-data-integrity: 基於 ZFS 的 RAID 級別，具有單奇偶校驗、雙奇偶校驗或三奇偶校驗。專為確保資料完整性而設計。
      tag-raid-50: RAID 50
      tag-stripe-of-raid-5-arrays-combines-performance-of-raid-0-with-redundancy-of-raid-5: RAID 5 陣列的條帶。兼具 RAID 0 的效能和 RAID 5 的冗餘性。
      tag-️-mtbf-mean-time-between-failures: ⏱️ MTBF（平均故障間隔時間）
      tag-the-average-time-in-hours-a-drive-is-expected-to-operate-before-failing-higher-mtbf-means-more-reliable-hardware: 驅動器在發生故障前預計執行的平均時間（以小時為單位）。MTBF 越高，硬體越可靠。
      tag-rebuild-time: 🔁 重建時間
      tag-the-time-required-to-reconstruct-data-on-a-replacement-drive-after-a-failure-longer-rebuild-times-increase-the-risk-of-a-second-failure-during-recovery: 發生故障後在替換驅動器上重建資料所需的時間。重建時間越長，恢復過程中再次發生故障的風險就越大。
      tag-mttdl-mean-time-to-data-loss: 📉 MTTDL（平均資料丟失時間）
      tag-a-statistical-estimate-of-how-long-a-raid-system-can-operate-before-data-loss-occurs-it-considers-drive-failures-rebuild-time-and-raid-redundancy-higher-mttdl-means-a-safer-system: 對 RAID 系統在資料丟失前可執行時間的統計估計。它會考慮驅動器故障、重建時間和 RAID 冗餘。MTTDL 越高，系統越安全。
      tag-bit-error-rate-ber: 🧮 誤位元速率（BER）
      tag-the-probability-that-a-bit-read-from-a-disk-will-be-incorrect-due-to-hardware-limitations-even-tiny-bers-like-1-in-a-trillion-can-cause-issues-during-rebuilds-especially-with-large-drives: 由於硬體限制，從磁碟讀取的某個位出現錯誤的機率。即使是微小的 BER（例如萬億分之一），也可能導致重建過程中出現問題，尤其是在大容量驅動器中。
      tag-unrecoverable-read-error-ure: 🧠 不可恢復的讀取錯誤（URE）
      tag-occurs-when-a-drive-fails-to-read-a-sector-during-rebuild-ber-contributes-to-ure-risk-which-can-compromise-raid-recovery: 當驅動器在重建期間無法讀取某個扇區時發生。BER 會增加 URE 風險，從而影響 RAID 恢復。
      tag-drive-capacity-tb: 📦 驅動器容量（TB）
      tag-total-storage-per-drive-larger-drives-take-longer-to-rebuild-and-are-more-susceptible-to-ber-related-errors: 每個驅動器的總儲存量。驅動器越大，重建所需的時間就越長，而且更容易受到 BER 相關錯誤的影響。
      tag-failure-probability: 📈 故障機率
      tag-the-chance-that-the-raid-system-will-experience-data-loss-over-a-given-time-period-e-g-5-years-calculated-using-mttdl-and-exponential-failure-models: RAID 系統在給定時間段（例如 5 年）內發生資料丟失的機率。使用 MTTDL 和指數故障模型計算。
