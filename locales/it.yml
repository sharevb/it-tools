      tag-key-terms-explained: 🧠 Spiegazione dei termini chiave
      tag-raid-level: Livello RAID
      tag-raid-redundant-array-of-independent-disks-is-a-method-of-combining-multiple-physical-drives-into-one-logical-unit-to-improve-performance-redundancy-or-both:
        RAID (Redundant Array of Independent Disks) è un metodo per combinare più
        unità fisiche in un'unica unità logica per migliorare le prestazioni,
        la ridondanza, o entrambe.
      tag-description: Descrizione
      tag-raid-0: RAID 0
      tag-striping-only-no-redundancy-fast-but-risky-if-one-drive-fails-all-data-is-lost:
        "Solo striping. Nessuna ridondanza. Veloce ma rischioso: se un'unità fallisce, tutti i dati sono persi."
      tag-raid-1: RAID 1
      tag-mirroring-data-is-duplicated-across-drives-high-redundancy-low-capacity-efficiency:
        Mirroring. I dati sono duplicati tra le unità. Alta ridondanza, bassa
        efficienza di capacità.
      tag-raid-5: RAID 5
      tag-striping-with-parity-can-tolerate-one-drive-failure-balanced-speed-and-redundancy:
        Striping con parità. Può tollerare un guasto di unità. Velocità e ridondanza
        bilanciate.
      tag-raid-6: RAID 6
      tag-double-parity-can-survive-two-drive-failures: Doppia parità. Può sopravvivere a due guasti di unità.
      tag-raid-10: RAID 10
      tag-mirrored-pairs-striped-together-high-performance-and-redundancy: Coppie con mirror unite in stripe. Alte prestazioni e ridondanza.
      tag-raid-z1-z2-z3: RAID-Z1/Z2/Z3
      tag-zfs-based-raid-levels-with-single-double-or-triple-parity-designed-for-data-integrity:
        Livelli RAID basati su ZFS con parità singola, doppia o tripla. Progettati
        per l'integrità dei dati.
      tag-raid-50: RAID 50
      tag-stripe-of-raid-5-arrays-combines-performance-of-raid-0-with-redundancy-of-raid-5:
        Stripe di array RAID 5. Combina le prestazioni di RAID 0 con la ridondanza
        di RAID 5.
      tag-️-mtbf-mean-time-between-failures: ⏱️ MTBF (Mean Time Between Failures)
      tag-the-average-time-in-hours-a-drive-is-expected-to-operate-before-failing-higher-mtbf-means-more-reliable-hardware:
        Il tempo medio (in ore) in cui un'unità dovrebbe operare prima di fallire.
        Un MTBF più alto significa hardware più affidabile.
      tag-rebuild-time: 🔁 Tempo di rebuild
      tag-the-time-required-to-reconstruct-data-on-a-replacement-drive-after-a-failure-longer-rebuild-times-increase-the-risk-of-a-second-failure-during-recovery:
        Il tempo necessario per ricostruire i dati su un'unità sostitutiva dopo un guasto.
        Tempi di rebuild più lunghi aumentano il rischio di un secondo guasto durante il recupero.
      tag-mttdl-mean-time-to-data-loss: 📉 MTTDL (Mean Time To Data Loss)
      tag-a-statistical-estimate-of-how-long-a-raid-system-can-operate-before-data-loss-occurs-it-considers-drive-failures-rebuild-time-and-raid-redundancy-higher-mttdl-means-a-safer-system:
        Una stima statistica di quanto un sistema RAID può operare prima che si verifichi
        una perdita di dati. Considera i guasti delle unità, il tempo di rebuild e la ridondanza
        RAID. Un MTTDL più alto significa un sistema più sicuro.
      tag-bit-error-rate-ber: 🧮 Bit Error Rate (BER)
      tag-the-probability-that-a-bit-read-from-a-disk-will-be-incorrect-due-to-hardware-limitations-even-tiny-bers-like-1-in-a-trillion-can-cause-issues-during-rebuilds-especially-with-large-drives:
        La probabilità che un bit letto da un disco sia errato a causa di limitazioni
        hardware. Anche i BER minuscoli (come 1 su un trilione) possono causare problemi
        durante i rebuild, soprattutto con unità di grandi dimensioni.
      tag-unrecoverable-read-error-ure: 🧠 Unrecoverable Read Error (URE)
      tag-occurs-when-a-drive-fails-to-read-a-sector-during-rebuild-ber-contributes-to-ure-risk-which-can-compromise-raid-recovery:
        Si verifica quando un'unità non riesce a leggere un settore durante il rebuild. Il BER
        contribuisce al rischio di URE, che può compromettere il recupero RAID.
      tag-drive-capacity-tb: 📦 Capacità dell'unità (TB)
      tag-total-storage-per-drive-larger-drives-take-longer-to-rebuild-and-are-more-susceptible-to-ber-related-errors:
        Archiviazione totale per unità. Le unità più grandi impiegano più tempo a ricostruire
        e sono più soggette a errori legati al BER.
      tag-failure-probability: 📈 Probabilità di guasto
      tag-the-chance-that-the-raid-system-will-experience-data-loss-over-a-given-time-period-e-g-5-years-calculated-using-mttdl-and-exponential-failure-models:
        La probabilità che il sistema RAID subisca una perdita di dati in un dato periodo
        di tempo (es. 5 anni). Calcolata usando MTTDL e modelli di guasto esponenziali.
