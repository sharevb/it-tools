        tcpdump è un'utility comunemente installata/disponibile in molte
        distribuzioni Linux, usata per raccogliere rapidamente trace di rete / catture
        di pacchetti. In breve, è il wireshark di Linux per la cattura dei pacchetti.
        tcpdump è molto versatile, con molti switch per catturare in modo granulare ciò
        che serve per il debug del traffico di rete; con opzioni per l'output su console,
        file o pcap di wireshark.
      tag-this-utility-is-to-help-generate-a-tcpdump-command-using-some-of-the-more-common-switches-filters-offered-by-the-tcpdump-this-utility-is-not-encompassing-of-all-options-tcpdump-offers-a-complete-list-of-options-can-be-found-via-its-manual-nbsp:
        Questa utility aiuta a generare un comando tcpdump usando alcuni degli
        switch/filtri più comuni offerti da tcpdump. L'utility non copre tutte le
        opzioni di tcpdump; l'elenco completo delle opzioni è disponibile nel suo manuale:&nbsp;
      tag-https-www-tcpdump-org-manpages-tcpdump-1-html: https://www.tcpdump.org/manpages/tcpdump.1.html
      tag-note: "Nota:"
      tag-nbsp-host-source-host-and-destination-host-can-take-multiple-entries-separate-your-entries-with-a-comma-space-or-semicolon:
        "&nbsp;Host, Host sorgente e Host di destinazione possono contenere più
        voci. Separa le voci con una virgola, uno spazio o un punto e virgola."
      tag-note-2: "Nota 2:"
      tag-nbsp-when-you-specify-a-source-src-or-destination-dst-flags-tcpdump-will-only-filter-in-that-direction-if-you-are-looking-to-capture-full-tcp-handshake-make-sure-you-use-host-vs-src-host-or-dst-host-to-see-both-request-and-response-flow:
        '&nbsp;Quando specifichi i flag sorgente (src) o destinazione (dst),
        tcpdump filtrerà solo in quella direzione. Se vuoi catturare l''intero
        handshake TCP, assicurati di usare "host" invece di "src host" o
        "dst host" per vedere sia il flusso di richiesta che di risposta.'
      tag-the-network-interface-to-capture-packets-from: L'interfaccia di rete da cui catturare i pacchetti.
      tag-capture-packets-originating-from-this-host: Cattura i pacchetti provenienti da questo host.
      tag-capture-packets-destined-for-this-host: Cattura i pacchetti destinati a questo host.
      tag-filter-packets-from-this-source-port: Filtra i pacchetti provenienti da questa porta sorgente.
      tag-filter-packets-going-to-this-destination-port: Filtra i pacchetti destinati a questa porta di destinazione.
      tag-stop-capturing-after-this-number-of-packets: Interrompi la cattura dopo questo numero di pacchetti.
      tag-n: -n
      tag-prevent-resolving-ips-to-hostnames: Impedisce la risoluzione degli IP in nomi host.
      tag-e: -e
      tag-display-link-layer-headers-in-output: Mostra le intestazioni di livello di collegamento nell'output.
      tag-q: -q
      tag-show-less-verbose-packet-information: Mostra informazioni sui pacchetti meno dettagliate.
      tag-save-captured-packets-to-a-file: Salva i pacchetti catturati in un file.
