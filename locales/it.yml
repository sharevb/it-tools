  tools:
    name: Nome
    desc: Descrizione
    category: Categoria
  content-fork: >
    # Informazioni su IT-Tools

    Questo splendido sito, realizzato con ❤️ inizialmente da [Corentin
    Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) ed
    esteso da ShareVB, raccoglie strumenti utili per sviluppatori e persone che
    lavorano nell'IT. Se lo trovi utile, condividilo con chi pensi possa
    apprezzarlo e non dimenticare di aggiungerlo ai preferiti del browser!

    IT Tools è open-source (licenza GPL-3.0) e gratuito, e lo sarà sempre. Se
    vuoi sostenere il lavoro su questo fork e incoraggiarmi ad aggiungere altri
    strumenti o funzionalità, considera di supportarmi con una
    [donazione](https://www.buymeacoffee.com/sharevb).

    ## Tecnologie

    IT Tools è realizzato in Vue.js (Vue 3) con la libreria di componenti Naive
    UI ed è ospitato e distribuito in continuo da Vercel. Alcuni strumenti
    utilizzano librerie open-source di terze parti; l'elenco completo è nel
    file [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    del repository.

    ## Trovato un bug? Manca uno strumento?

    Se hai bisogno di uno strumento che qui non c'è e pensi possa essere utile,
    puoi inviare una richiesta di funzionalità nella sezione [issues](https://github.com/sharevb/it-tools/issues/new/choose)
    del repository GitHub.

    E se hai trovato un bug, o qualcosa non funziona come previsto, segnalalo
    nella sezione [issues](https://github.com/sharevb/it-tools/issues/new/choose)
    del repository GitHub.
