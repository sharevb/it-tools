    service:
      text:
        3-drive-failures-per-raid-7-set: 3 guasti di unità per set RAID 7
        raid-70-requires-at-least-10-disks-with-5-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks:
          RAID 70 richiede almeno 10 dischi con un minimo di 5 per stripe. Le stripe
          devono contenere un numero uguale di dischi.
        raid-70-stripes-multiple-raid-7-arrays-together-raid-7-raid-0-each-raid-7-set-can-sustain-three-drive-failures:
          RAID 70 raggruppa in stripe più array RAID 7 (RAID 7 + RAID 0).
          Ogni set RAID 7 può sopportare tre guasti di unità.
        2-drive-failures-per-raid-6-set: 2 guasti di unità per set RAID 6
        raid-60-requires-at-least-8-disks-with-4-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks:
          RAID 60 richiede almeno 8 dischi con un minimo di 4 per stripe. Le stripe
          devono contenere un numero uguale di dischi.
        raid-60-stripes-multiple-raid-6-arrays-together-raid-6-raid-0-each-raid-6-set-can-sustain-two-drive-failures:
          RAID 60 raggruppa in stripe più array RAID 6 (RAID 6 + RAID 0).
          Ogni set RAID 6 può sopportare due guasti di unità.
        1-drive-failure-per-raid-5-set: 1 guasto di unità per set RAID 5
        raid-50-requires-at-least-6-disks-with-3-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks:
          RAID 50 richiede almeno 6 dischi con un minimo di 3 per stripe. Le stripe
          devono contenere un numero uguale di dischi.
        raid-50-stripes-multiple-raid-5-arrays-together-raid-5-raid-0-each-raid-5-set-can-sustain-a-single-drive-failure:
          RAID 50 raggruppa in stripe più array RAID 5 (RAID 5 + RAID 0).
          Ogni set RAID 5 può sopportare un singolo guasto di unità.
        1-drive-failure-per-mirrored-set: 1 guasto di unità per set con mirror
        raid-10-requires-an-even-number-of-at-least-4-disks: RAID 10 richiede un numero pari di almeno 4 dischi
        raid-10-is-a-stripe-of-mirrors-raid-1-raid-0-each-set-of-drives-is-mirrored-and-striped-together-so-that-each-drive-in-the-set-is-fault-tolerant-within-the-group:
          RAID 10 è una stripe di mirror (RAID 1 + RAID 0). Ogni set di unità
          è sottoposto a mirror e stripe insieme, così che ogni unità del set sia
          tollerante ai guasti all'interno del gruppo.
        3-drive-failures: 3 guasti di unità
        raid-7-requires-at-least-5-disks: RAID 7 richiede almeno 5 dischi
        raid-7-raid-tp-non-standard-is-similiar-to-raid-5-and-raid-6-but-with-a-third-parity-block-this-allows-for-a-third-disk-failure-at-the-cost-of-storage-reduction-equal-to-three-drives:
          RAID 7/RAID TP (non standard) è simile a RAID 5 e RAID 6 ma con un terzo
          blocco di parità. Consente un terzo guasto di disco a costo di una riduzione
          dello spazio pari a tre unità.
        2-drive-failures: 2 guasti di unità
        raid-6-requires-at-least-4-disks: RAID 6 richiede almeno 4 dischi
        raid-6-is-similiar-to-raid-5-but-with-an-additional-parity-block-this-allows-for-an-additional-disk-failure-at-the-cost-of-storage-reduction-equal-to-two-drives:
          RAID 6 è simile a RAID 5 ma con un blocco di parità aggiuntivo. Consente
          un guasto di disco aggiuntivo a costo di una riduzione dello spazio pari a due unità.
        1-drive-failure: 1 guasto di unità
        raid-5-requires-at-least-3-disks: RAID 5 richiede almeno 3 dischi
        raid-5-uses-block-level-striping-with-parity-this-allows-for-fault-tolerance-with-a-storage-reduction-equal-to-one-drive-for-the-parity-information:
          RAID 5 usa lo striping a livello di blocco con parità. Consente tolleranza ai guasti
          con una riduzione dello spazio pari a un'unità per le informazioni di parità.
        raid-1-requires-at-least-1-disk: RAID 1 richiede almeno 1 disco
        raid-1-consists-of-an-exact-copy-of-the-data-mirror-across-two-or-more-disks-the-array-will-operate-as-long-as-at-least-one-drive-is-operational:
          RAID 1 consiste in una copia esatta dei dati (mirror) su due o più dischi.
          L'array funziona finché almeno un'unità è operativa.
        raid-0-requires-at-least-1-disk: RAID 0 richiede almeno 1 disco
        raid-0-splits-data-evenly-across-2-or-more-disks-without-redunancy-or-fault-tolerance-creating-one-large-storage-space:
