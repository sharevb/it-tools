    PomodoroAbout:
      text:
        source-wikipedia: "Fonte:    Wikipedia"
        once-the-long-break-is-finished-return-to-step-1: Una volta terminata la pausa lunga, torna al Passo 1.
        keep-repeating-steps-1-3-but-after-your-4th-task-take-a-long-break-instead-of-a-short-break-20-30-minutes-is-common:
          Continua a ripetere i Passi 1-3, ma dopo il 4° compito fai una pausa
          lunga invece di una pausa breve (20-30 minuti è comune).
        when-the-timer-rings-take-a-short-break-5-10-minutes-is-common: Quando suona il timer, fai una pausa breve (5-10 minuti è comune).
        work-on-the-task-during-that-time: Lavora al compito durante quel tempo.
        decide-on-a-task-and-set-the-timer-25-minutes-is-common: Decidi un compito e imposta il timer (25 minuti è comune).
        five-steps-of-the-pomodoro-technique: I cinque passi della tecnica Pomodoro
        the-pomodoro-technique-is-a-time-management-method-developed-by-francesco-cirillo-in-the-1980s-it-uses-a-timer-to-break-work-into-intervals-typically-25-minutes-in-length-separated-by-short-breaks-each-interval-is-known-as-a-pomodoro-from-the-italian-word-for-tomato-after-the-tomato-shaped-kitchen-timer-cirillo-used-as-a-university-student:
          La tecnica Pomodoro è un metodo di gestione del tempo sviluppato da
          Francesco Cirillo negli anni '80. Usa un timer per suddividere il lavoro
          in intervalli, in genere di 25 minuti, separati da pause brevi.
          Ogni intervallo è noto come pomodoro, dalla parola italiana per "pomodoro",
          dal timer da cucina a forma di pomodoro che Cirillo usava da studente universitario.
        the-pomodoro-technique: La tecnica Pomodoro
