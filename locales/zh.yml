      tag-note: 注意：
      tag-nbsp-host-source-host-and-destination-host-can-take-multiple-entries-separate-your-entries-with-a-comma-space-or-semicolon: "&nbsp;主机、源主机和目标主机可接受多个条目，用逗号、空格或分号分隔。"
      tag-note-2: 注意 2：
      tag-nbsp-when-you-specify-a-source-src-or-destination-dst-flags-tcpdump-will-only-filter-in-that-direction-if-you-are-looking-to-capture-full-tcp-handshake-make-sure-you-use-host-vs-src-host-or-dst-host-to-see-both-request-and-response-flow:
        '&nbsp;指定源（src）或目标（dst）标志时，tcpdump 仅会按该方向过滤。若要捕获完整的 TCP 握手过程，请使用“host”而非“src host”或“dst host”，以同时查看请求和响应流量。'
