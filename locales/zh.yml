  mttdl-calculator:
    title: RAID 可靠性计算器
    description: 使用著名的 MTTDL 方法计算存储系统可靠性
    texts:
      label-raid-0: RAID 0
      label-raid-1: RAID 1
      label-raid-5: RAID 5
      label-raid-6: RAID 6
      label-raid-10: RAID 10
      label-raid-z1: RAID-Z1
      label-raid-z2: RAID-Z2
      label-raid-z3: RAID-Z3
      label-raid-50: RAID 50
      title-mttdl-failure-probability-calculator: MTTDL 和故障概率计算器
      label-raid-level: RAID 级别：
      placeholder-select-raid-level: 选择 RAID 级别
      label-number-of-drives: 驱动器数量：
      label-drive-mtbf-hours: "驱动器 MTBF（小时）："
      label-rebuild-time-hours: 重建时间（小时）：
      label-bit-error-rate-ber-in-1ex: 误码率（BER，1eX）：
      label-drive-capacity-tb: "驱动器容量（TB）："
      label-years-for-failure-probability: 故障概率年限：
      label-mttdl-hours: MTTDL（小时）：
      label-mttdl-years: MTTDL（年）：
      label-failure-probability: 故障概率：
      tag-key-terms-explained: 🧠 关键术语解释
      tag-raid-level: RAID 级别
      tag-raid-redundant-array-of-independent-disks-is-a-method-of-combining-multiple-physical-drives-into-one-logical-unit-to-improve-performance-redundancy-or-both: RAID（独立磁盘冗余阵列）是一种将多个物理驱动器组合成一个逻辑单元以提高性能、冗余度或两者的方法。
      tag-description: 描述
      tag-raid-0: RAID 0
      tag-striping-only-no-redundancy-fast-but-risky-if-one-drive-fails-all-data-is-lost: 仅限条带化。无冗余。速度快但风险高——如果一个驱动器发生故障，所有数据都会丢失。
      tag-raid-1: RAID 1
      tag-mirroring-data-is-duplicated-across-drives-high-redundancy-low-capacity-efficiency: 镜像。数据在驱动器之间复制。冗余度高，但容量效率低。
      tag-raid-5: RAID 5
      tag-striping-with-parity-can-tolerate-one-drive-failure-balanced-speed-and-redundancy: 带奇偶校验的条带化。可容忍一个驱动器故障。速度和冗余均衡。
      tag-raid-6: RAID 6
      tag-double-parity-can-survive-two-drive-failures: 双重奇偶校验。可承受两个驱动器故障。
      tag-raid-10: RAID 10
      tag-mirrored-pairs-striped-together-high-performance-and-redundancy: 镜像对再条带化。高性能、高冗余。
      tag-raid-z1-z2-z3: RAID-Z1/Z2/Z3
      tag-zfs-based-raid-levels-with-single-double-or-triple-parity-designed-for-data-integrity: 基于 ZFS 的 RAID 级别，具有单奇偶校验、双奇偶校验或三奇偶校验。专为确保数据完整性而设计。
      tag-raid-50: RAID 50
      tag-stripe-of-raid-5-arrays-combines-performance-of-raid-0-with-redundancy-of-raid-5: RAID 5 阵列的条带。兼具 RAID 0 的性能和 RAID 5 的冗余性。
      tag-️-mtbf-mean-time-between-failures: ⏱️ MTBF（平均故障间隔时间）
      tag-the-average-time-in-hours-a-drive-is-expected-to-operate-before-failing-higher-mtbf-means-more-reliable-hardware: 驱动器在发生故障前预计运行的平均时间（以小时为单位）。MTBF 越高，硬件越可靠。
      tag-rebuild-time: 🔁 重建时间
      tag-the-time-required-to-reconstruct-data-on-a-replacement-drive-after-a-failure-longer-rebuild-times-increase-the-risk-of-a-second-failure-during-recovery: 发生故障后在替换驱动器上重建数据所需的时间。重建时间越长，恢复过程中再次发生故障的风险就越大。
      tag-mttdl-mean-time-to-data-loss: 📉 MTTDL（平均数据丢失时间）
      tag-a-statistical-estimate-of-how-long-a-raid-system-can-operate-before-data-loss-occurs-it-considers-drive-failures-rebuild-time-and-raid-redundancy-higher-mttdl-means-a-safer-system: 对 RAID 系统在数据丢失前可运行时间的统计估计。它会考虑驱动器故障、重建时间和 RAID 冗余。MTTDL 越高，系统越安全。
      tag-bit-error-rate-ber: 🧮 误码率（BER）
      tag-the-probability-that-a-bit-read-from-a-disk-will-be-incorrect-due-to-hardware-limitations-even-tiny-bers-like-1-in-a-trillion-can-cause-issues-during-rebuilds-especially-with-large-drives: 由于硬件限制，从磁盘读取的某个位出现错误的概率。即使是微小的 BER（例如万亿分之一），也可能导致重建过程中出现问题，尤其是在大容量驱动器中。
      tag-unrecoverable-read-error-ure: 🧠 不可恢复的读取错误（URE）
      tag-occurs-when-a-drive-fails-to-read-a-sector-during-rebuild-ber-contributes-to-ure-risk-which-can-compromise-raid-recovery: 当驱动器在重建期间无法读取某个扇区时发生。BER 会增加 URE 风险，从而影响 RAID 恢复。
      tag-drive-capacity-tb: 📦 驱动器容量（TB）
      tag-total-storage-per-drive-larger-drives-take-longer-to-rebuild-and-are-more-susceptible-to-ber-related-errors: 每个驱动器的总存储量。驱动器越大，重建所需的时间就越长，而且更容易受到 BER 相关错误的影响。
      tag-failure-probability: 📈 故障概率
      tag-the-chance-that-the-raid-system-will-experience-data-loss-over-a-given-time-period-e-g-5-years-calculated-using-mttdl-and-exponential-failure-models: RAID 系统在给定时间段（例如 5 年）内发生数据丢失的概率。使用 MTTDL 和指数故障模型计算。
