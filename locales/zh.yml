      tag-space-efficiency: 空间效率
    text:
      num-1-drive-failures: "{0} 个磁盘故障"
    service:
      text:
        3-drive-failures-per-raid-7-set: 每个 RAID 7 集可容忍 3 个磁盘故障
        raid-70-requires-at-least-10-disks-with-5-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks: RAID 70 至少需要 10 个磁盘，每条带至少 5 个。每条带必须包含相同数量的磁盘。
        raid-70-stripes-multiple-raid-7-arrays-together-raid-7-raid-0-each-raid-7-set-can-sustain-three-drive-failures: RAID 70 将多个 RAID 7 阵列条带化在一起（RAID 7 + RAID 0）。每个 RAID 7 集可承受 3 个磁盘故障。
        2-drive-failures-per-raid-6-set: 每个 RAID 6 集可容忍 2 个磁盘故障
        raid-60-requires-at-least-8-disks-with-4-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks: RAID 60 至少需要 8 个磁盘，每条带至少 4 个。每条带必须包含相同数量的磁盘。
        raid-60-stripes-multiple-raid-6-arrays-together-raid-6-raid-0-each-raid-6-set-can-sustain-two-drive-failures: RAID 60 将多个 RAID 6 阵列条带化在一起（RAID 6 + RAID 0）。每个 RAID 6 集可承受 2 个磁盘故障。
        1-drive-failure-per-raid-5-set: 每个 RAID 5 集可容忍 1 个磁盘故障
        raid-50-requires-at-least-6-disks-with-3-minimum-per-stripe-stripes-must-contain-an-equal-number-of-disks: RAID 50 至少需要 6 个磁盘，每条带至少 3 个。每条带必须包含相同数量的磁盘。
        raid-50-stripes-multiple-raid-5-arrays-together-raid-5-raid-0-each-raid-5-set-can-sustain-a-single-drive-failure: RAID 50 将多个 RAID 5 阵列条带化在一起（RAID 5 + RAID 0）。每个 RAID 5 集可承受 1 个磁盘故障。
        1-drive-failure-per-mirrored-set: 每个镜像集可容忍 1 个磁盘故障
        raid-10-requires-an-even-number-of-at-least-4-disks: RAID 10 需要至少 4 个磁盘且数量为偶数
        raid-10-is-a-stripe-of-mirrors-raid-1-raid-0-each-set-of-drives-is-mirrored-and-striped-together-so-that-each-drive-in-the-set-is-fault-tolerant-within-the-group: RAID 10 是镜像的条带（RAID 1 + RAID 0）。每组磁盘被镜像并条带化，因此组内的每个磁盘都具有容错能力。
        3-drive-failures: 3 个磁盘故障
        raid-7-requires-at-least-5-disks: RAID 7 至少需要 5 个磁盘
        raid-7-raid-tp-non-standard-is-similiar-to-raid-5-and-raid-6-but-with-a-third-parity-block-this-allows-for-a-third-disk-failure-at-the-cost-of-storage-reduction-equal-to-three-drives:
          RAID 7/RAID TP（非标准）类似于 RAID 5 和 RAID 6，但多了第三个奇偶校验块。这样可容忍第三个磁盘故障，代价是存储空间减少相当于 3 个磁盘的容量。
        2-drive-failures: 2 个磁盘故障
        raid-6-requires-at-least-4-disks: RAID 6 至少需要 4 个磁盘
        raid-6-is-similiar-to-raid-5-but-with-an-additional-parity-block-this-allows-for-an-additional-disk-failure-at-the-cost-of-storage-reduction-equal-to-two-drives: RAID 6 类似于 RAID 5，但多了一个奇偶校验块。这样可多容忍一个磁盘故障，代价是存储空间减少相当于 2 个磁盘的容量。
        1-drive-failure: 1 个磁盘故障
        raid-5-requires-at-least-3-disks: RAID 5 至少需要 3 个磁盘
        raid-5-uses-block-level-striping-with-parity-this-allows-for-fault-tolerance-with-a-storage-reduction-equal-to-one-drive-for-the-parity-information: RAID 5 使用带奇偶校验的块级条带化。这样可实现容错，奇偶校验信息会占用相当于 1 个磁盘的存储空间。
        raid-1-requires-at-least-1-disk: RAID 1 至少需要 1 个磁盘
        raid-1-consists-of-an-exact-copy-of-the-data-mirror-across-two-or-more-disks-the-array-will-operate-as-long-as-at-least-one-drive-is-operational: RAID 1 由跨两个或多个磁盘的精确数据副本（镜像）组成。只要至少一个磁盘正常运行，阵列即可运行。
        raid-0-requires-at-least-1-disk: RAID 0 至少需要 1 个磁盘
        raid-0-splits-data-evenly-across-2-or-more-disks-without-redunancy-or-fault-tolerance-creating-one-large-storage-space: RAID 0 将数据均匀拆分到 2 个或多个磁盘，无冗余或容错，创建一个大的存储空间。
