  pomodoro-timer:
    title: 番茄钟计时器
    description: 基础番茄钟计时器
    texts:
      tag-import-pomodoroapp-from-app-pomodoroapp-vue: import PomodoroApp from './app/PomodoroApp.vue';
    PomodoroAbout:
      text:
        source-wikipedia: 来源：维基百科
        once-the-long-break-is-finished-return-to-step-1: 长休息结束后，返回步骤 1。
        keep-repeating-steps-1-3-but-after-your-4th-task-take-a-long-break-instead-of-a-short-break-20-30-minutes-is-common: 重复步骤 1-3，但完成第 4 项任务后，进行长休息而非短休息（通常 20-30 分钟）。
        when-the-timer-rings-take-a-short-break-5-10-minutes-is-common: 计时器响起时，进行短休息（通常 5-10 分钟）。
        work-on-the-task-during-that-time: 在此期间处理任务。
        decide-on-a-task-and-set-the-timer-25-minutes-is-common: 确定任务并设置计时器（通常 25 分钟）。
        five-steps-of-the-pomodoro-technique: 番茄工作法的五个步骤
        the-pomodoro-technique-is-a-time-management-method-developed-by-francesco-cirillo-in-the-1980s-it-uses-a-timer-to-break-work-into-intervals-typically-25-minutes-in-length-separated-by-short-breaks-each-interval-is-known-as-a-pomodoro-from-the-italian-word-for-tomato-after-the-tomato-shaped-kitchen-timer-cirillo-used-as-a-university-student:
          番茄工作法是由弗朗切斯科·西里洛于 20 世纪 80 年代开发的时间管理方法。它使用计时器将工作分解为间隔（通常 25 分钟），间隔之间有短暂休息。每个间隔称为一个“番茄钟”，名称源自意大利语中的“番茄”（因西里洛大学时期使用的厨房计时器形状类似番茄）。
        the-pomodoro-technique: 番茄工作法
