  http-status-codes:
    title: HTTP स्थिति कोड
    description: सभी HTTP स्टेटस कोड, उनके नाम और उनके अर्थ की सूची।
    texts:
      placeholder-search-http-status: HTTP स्टेटस खोजें...
      title-view-mdn-documentation: MDN दस्तावेज़ देखें
    constants:
      text:
        the-client-needs-to-authenticate-to-gain-network-access: नेटवर्क एक्सेस प्राप्त
          करने के लिए क्लाइंट को प्रमाणीकरण की आवश्यकता होती है।
        network-authentication-required: नेटवर्क प्रमाणीकरण आवश्यक है
        further-extensions-to-the-request-are-required-for-the-server-to-fulfill-it:
          सर्वर द्वारा अनुरोध को पूरा करने के लिए उसमें और विस्तार की आवश्यकता
          है।
        not-extended: विस्तारित नहीं
        the-server-detected-an-infinite-loop-while-processing-the-request: अनुरोध को संसाधित करते समय सर्वर ने एक अनंत लूप का पता लगाया।
        loop-detected: लूप का पता चला
        the-server-is-unable-to-store-the-representation-needed-to-complete-the-request:
          सर्वर अनुरोध को पूरा करने के लिए आवश्यक प्रतिनिधित्व को संग्रहीत करने
          में असमर्थ है।
        insufficient-storage: अपर्याप्त भंडारण
        transparent-content-negotiation-for-the-request-results-in-a-circular-reference:
          अनुरोध के लिए पारदर्शी सामग्री वार्ता के परिणामस्वरूप एक चक्रीय संदर्भ
          उत्पन्न होता है।
        variant-also-negotiates: वेरिएंट भी बातचीत करता है
        the-server-does-not-support-the-http-protocol-version-used-in-the-request:
          सर्वर अनुरोध में उपयोग किए गए HTTP प्रोटोकॉल संस्करण का समर्थन नहीं
          करता है।
        http-version-not-supported: HTTP संस्करण समर्थित नहीं है
        the-server-was-acting-as-a-gateway-or-proxy-and-did-not-receive-a-timely-response-from-the-upstream-server:
          सर्वर एक गेटवे या प्रॉक्सी के रूप में कार्य कर रहा था और उसे अपस्ट्रीम
          सर्वर से समय पर प्रतिक्रिया नहीं मिली।
        gateway-timeout: गेटवे समय समाप्त
        the-server-is-currently-unavailable-because-it-is-overloaded-or-down-for-maintenance:
          सर्वर फिलहाल अनुपलब्ध है (क्योंकि यह ओवरलोडेड है या रखरखाव के लिए बंद
          है)।
        service-unavailable: सेवा अनुपलब्ध है
        the-server-was-acting-as-a-gateway-or-proxy-and-received-an-invalid-response-from-the-upstream-server:
          सर्वर एक गेटवे या प्रॉक्सी के रूप में कार्य कर रहा था और उसे अपस्ट्रीम
          सर्वर से एक अमान्य प्रतिक्रिया प्राप्त हुई।
        bad-gateway: खराब गेटवे
        the-server-either-does-not-recognize-the-request-method-or-it-lacks-the-ability-to-fulfill-the-request:
          सर्वर या तो अनुरोध विधि को पहचान नहीं पाता है, या उसमें अनुरोध को पूरा
          करने की क्षमता नहीं है।
        not-implemented: लागू नहीं किया गया
        a-generic-error-message-given-when-an-unexpected-condition-was-encountered-and-no-more-specific-message-is-suitable:
          एक सामान्य त्रुटि संदेश, जो तब दिया जाता है जब कोई अप्रत्याशित स्थिति
          उत्पन्न होती है और कोई अधिक विशिष्ट संदेश उपयुक्त नहीं होता है।
        internal-server-error: आंतरिक सर्वर त्रुटि
        5xx-server-error: 5xx सर्वर त्रुटि
        a-server-operator-has-received-a-legal-demand-to-deny-access-to-a-resource-or-to-a-set-of-resources-that-includes-the-requested-resource:
          एक सर्वर ऑपरेटर को किसी संसाधन या संसाधनों के समूह तक पहुंच को
          अस्वीकार करने के लिए एक कानूनी मांग प्राप्त हुई है जिसमें अनुरोधित
          संसाधन शामिल है।
        unavailable-for-legal-reasons: कानूनी कारणों से अनुपलब्ध
        the-server-is-unwilling-to-process-the-request-because-either-an-individual-header-field-or-all-the-header-fields-collectively-are-too-large:
          सर्वर अनुरोध को संसाधित करने के लिए तैयार नहीं है क्योंकि या तो एक
          व्यक्तिगत हेडर फ़ील्ड, या सभी हेडर फ़ील्ड सामूहिक रूप से, बहुत बड़े
          हैं।
        request-header-fields-too-large: अनुरोध हेडर फ़ील्ड बहुत बड़े हैं
        the-user-has-sent-too-many-requests-in-a-given-amount-of-time: उपयोगकर्ता ने एक निश्चित समयावधि में बहुत अधिक अनुरोध भेजे हैं।
        too-many-requests: बहुत अधिक अनुरोध
        the-origin-server-requires-the-request-to-be-conditional: मूल सर्वर को अनुरोध सशर्त होने की आवश्यकता होती है।
        precondition-required: पूर्व शर्त आवश्यक
        the-client-should-switch-to-a-different-protocol-such-as-tls-1-0: क्लाइंट को TLS/1.0 जैसे किसी अन्य प्रोटोकॉल पर स्विच करना चाहिए।
        upgrade-required: अपग्रेड आवश्यक है
        indicates-that-the-server-is-unwilling-to-risk-processing-a-request-that-might-be-replayed:
          यह इंगित करता है कि सर्वर ऐसे अनुरोध को संसाधित करने का जोखिम उठाने को
          तैयार नहीं है जिसे दोबारा भेजा जा सकता है।
        too-early: अभी बहुत जल्दी है
        the-request-failed-due-to-failure-of-a-previous-request: यह अनुरोध पिछले अनुरोध की विफलता के कारण विफल रहा।
        failed-dependency: निर्भरता विफल
        the-resource-that-is-being-accessed-is-locked: जिस संसाधन तक पहुँचने का प्रयास किया जा रहा है, वह लॉक है।
        locked: बंद
        the-request-was-well-formed-but-was-unable-to-be-followed-due-to-semantic-errors:
          अनुरोध सही ढंग से तैयार किया गया था, लेकिन शाब्दिक त्रुटियों के कारण
          इसका पालन नहीं किया जा सका।
        unprocessable-entity: अप्रक्रिया योग्य इकाई
        the-request-was-directed-at-a-server-that-is-not-able-to-produce-a-response:
          यह अनुरोध एक ऐसे सर्वर को भेजा गया था जो प्रतिक्रिया देने में सक्षम
          नहीं है।
        misdirected-request: गलत दिशा में भेजा गया अनुरोध
        the-server-refuses-the-attempt-to-brew-coffee-with-a-teapot: वेटर ने चायदानी से कॉफी बनाने की कोशिश को अस्वीकार कर दिया।
        i-m-a-teapot: मैं एक चायदानी हूँ
        the-server-cannot-meet-the-requirements-of-the-expect-request-header-field:
          सर्वर एक्सपेक्ट रिक्वेस्ट-हेडर फ़ील्ड की आवश्यकताओं को पूरा नहीं कर
          सकता है।
        expectation-failed: अपेक्षा विफल रही
        the-client-has-asked-for-a-portion-of-the-file-but-the-server-cannot-supply-that-portion:
          ग्राहक ने फाइल का एक हिस्सा मांगा है, लेकिन सर्वर वह हिस्सा उपलब्ध
          नहीं करा सकता।
        range-not-satisfiable: सीमा संतोषजनक नहीं है
        the-request-entity-has-a-media-type-which-the-server-or-resource-does-not-support:
          अनुरोध इकाई का मीडिया प्रकार ऐसा है जिसे सर्वर या संसाधन समर्थित नहीं
          करता है।
        unsupported-media-type: असमर्थित मीडिया प्रकार
        the-uri-provided-was-too-long-for-the-server-to-process: सर्वर द्वारा संसाधित
          किए जाने के लिए प्रदान किया गया यूआरआई बहुत लंबा था।
        uri-too-long: यूआरआई बहुत लंबा है
        the-request-is-larger-than-the-server-is-willing-or-able-to-process: यह अनुरोध सर्वर की क्षमता या इच्छाशक्ति से कहीं अधिक बड़ा है।
        payload-too-large: पेलोड बहुत बड़ा है
        the-server-does-not-meet-one-of-the-preconditions-that-the-requester-put-on-the-request:
          सर्वर अनुरोधकर्ता द्वारा अनुरोध पर लगाई गई पूर्व शर्तों में से एक को
          पूरा नहीं करता है।
        precondition-failed: पूर्व शर्त विफल
        the-request-did-not-specify-the-length-of-its-content-which-is-required-by-the-requested-resource:
          अनुरोध में उसकी सामग्री की लंबाई निर्दिष्ट नहीं की गई थी, जो अनुरोधित
          संसाधन के लिए आवश्यक है।
        length-required: आवश्यक लंबाई
        indicates-that-the-resource-requested-is-no-longer-available-and-will-not-be-available-again:
          यह दर्शाता है कि अनुरोधित संसाधन अब उपलब्ध नहीं है और भविष्य में भी
          उपलब्ध नहीं होगा।
        gone: गया
        indicates-that-the-request-could-not-be-processed-because-of-conflict-in-the-request-such-as-an-edit-conflict:
          यह इंगित करता है कि अनुरोध में किसी प्रकार के विरोधाभास, जैसे कि
          संपादन संबंधी विरोधाभास, के कारण अनुरोध को संसाधित नहीं किया जा सका।
        conflict: टकराव
        the-server-timed-out-waiting-for-the-request: सर्वर अनुरोध की प्रतीक्षा करते-करते समय समाप्त हो गया।
        request-timeout: ब्रेक का अनुरोध
        the-client-must-first-authenticate-itself-with-the-proxy: क्लाइंट को सबसे पहले प्रॉक्सी के साथ खुद को प्रमाणित करना होगा।
        proxy-authentication-required: प्रॉक्सी प्रमाणीकरण आवश्यक है
        the-requested-resource-is-capable-of-generating-only-content-not-acceptable-according-to-the-accept-headers-sent-in-the-request:
          अनुरोधित संसाधन केवल ऐसी सामग्री उत्पन्न करने में सक्षम है जो अनुरोध
          में भेजे गए 'स्वीकार करें' हेडर के अनुसार स्वीकार्य नहीं है।
        not-acceptable: अस्वीकार्य
        a-request-method-is-not-supported-for-the-requested-resource: अनुरोधित संसाधन के लिए अनुरोध विधि समर्थित नहीं है।
        method-not-allowed: विधि अनुमत नहीं
        the-requested-resource-could-not-be-found-but-may-be-available-in-the-future: अनुरोधित संसाधन नहीं मिल सका, लेकिन भविष्य में उपलब्ध हो सकता है।
        the-request-was-valid-but-the-server-is-refusing-action-the-user-might-not-have-the-necessary-permissions-for-a-resource:
          अनुरोध वैध था, लेकिन सर्वर कार्रवाई करने से इनकार कर रहा है। हो सकता
          है कि उपयोगकर्ता के पास किसी संसाधन के लिए आवश्यक अनुमतियाँ न हों।
        forbidden: निषिद्ध
        reserved-for-future-use-the-original-intention-was-that-this-code-might-be-used-as-part-of-some-form-of-digital-cash-or-micropayment-scheme:
          भविष्य में उपयोग के लिए आरक्षित। मूल उद्देश्य यह था कि इस कोड का उपयोग
          किसी प्रकार की डिजिटल नकदी या सूक्ष्म भुगतान योजना के हिस्से के रूप
          में किया जा सके।
        payment-required: भुगतान आवश्यक है
        similar-to-403-forbidden-but-specifically-for-use-when-authentication-is-required-and-has-failed-or-has-not-yet-been-provided:
          403 फॉरबिडन के समान, लेकिन विशेष रूप से तब उपयोग के लिए जब प्रमाणीकरण
          आवश्यक हो और विफल हो गया हो या अभी तक प्रदान नहीं किया गया हो।
        unauthorized: अनधिकृत
        the-server-cannot-or-will-not-process-the-request-due-to-an-apparent-client-error:
          किसी क्लाइंट त्रुटि के कारण सर्वर अनुरोध को संसाधित नहीं कर सकता या
          नहीं करेगा।
        bad-request: खराब अनुरोध
        4xx-client-error: 4xx क्लाइंट त्रुटि
        the-request-and-all-future-requests-should-be-repeated-using-another-uri:
          यह अनुरोध और भविष्य के सभी अनुरोध किसी अन्य यूआरआई का उपयोग करके
          दोहराए जाने चाहिए।
        permanent-redirect: स्थायी पुनर्निर्देशन
        in-this-case-the-request-should-be-repeated-with-another-uri-however-future-requests-should-still-use-the-original-uri:
          इस स्थिति में, अनुरोध को किसी अन्य यूआरआई के साथ दोहराया जाना चाहिए;
          हालांकि, भविष्य के अनुरोधों में मूल यूआरआई का ही उपयोग किया जाना
          चाहिए।
        temporary-redirect: अस्थायी पुनर्निर्देशन
        no-longer-used-originally-meant-subsequent-requests-should-use-the-specified-proxy:
          अब इसका उपयोग नहीं होता। मूल रूप से इसका अर्थ था "बाद के अनुरोधों में
          निर्दिष्ट प्रॉक्सी का उपयोग किया जाना चाहिए।"
        switch-proxy: स्विच प्रॉक्सी
        the-requested-resource-is-available-only-through-a-proxy-the-address-for-which-is-provided-in-the-response:
          अनुरोधित संसाधन केवल एक प्रॉक्सी के माध्यम से उपलब्ध है, जिसका पता
          प्रतिक्रिया में प्रदान किया गया है।
        use-proxy: प्रॉक्सी का उपयोग करें
        indicates-that-the-resource-has-not-been-modified-since-the-version-specified-by-the-request-headers:
          यह इंगित करता है कि अनुरोध हेडर द्वारा निर्दिष्ट संस्करण के बाद से
          संसाधन में कोई बदलाव नहीं किया गया है।
        not-modified: संशोधित नहीं
        the-response-to-the-request-can-be-found-under-another-uri-using-a-get-method:
          अनुरोध का उत्तर किसी अन्य यूआरआई के अंतर्गत जीईटी विधि का उपयोग करके
          प्राप्त किया जा सकता है।
        see-other: अन्य देखें
