  content-fork: >+
    # आईटी-टूल्स के बारे में

    यह शानदार वेबसाइट, जिसे मूल रूप से [कोरेंटिन
    थॉमसेट](https://corentin.tech?utm_source=it-tools&utm_medium=about) ने प्यार
    से बनाया था और बाद में ShareVB द्वारा विस्तारित किया गया, डेवलपर्स और आईटी
    क्षेत्र में काम करने वाले लोगों के लिए उपयोगी टूल्स का संग्रह प्रस्तुत करती
    है। यदि आपको यह उपयोगी लगे, तो कृपया इसे उन लोगों के साथ साझा करें जिन्हें
    लगता है कि यह उनके लिए भी उपयोगी हो सकता है और इसे अपने शॉर्टकट बार में
    बुकमार्क करना न भूलें!

    आईटी टूल्स ओपन-सोर्स (GPL-3.0 लाइसेंस के तहत) और निःशुल्क है, और हमेशा
    रहेगा। यदि आप इस फोर्क पर मेरे काम का समर्थन करना चाहते हैं, और मुझे और अधिक
    टूल्स या कार्यक्षमताओं को जोड़ने के लिए प्रोत्साहित करना चाहते हैं, तो कृपया
    [मुझे स्पॉन्सर करके](https://www.buymeacoffee.com/sharevb) मेरा समर्थन करने
    पर विचार करें।


    ## टेक्नोलॉजीज

    आईटी टूल्स Vue.js (Vue 3) में Naive UI कंपोनेंट लाइब्रेरी के साथ बनाया गया
    है और Vercel द्वारा होस्ट और निरंतर रूप से तैनात किया जाता है। कुछ टूल्स में
    थर्ड-पार्टी ओपन-सोर्स लाइब्रेरीज़ का उपयोग किया गया है। आप पूरी सूची
    रिपॉज़िटरी की
    [package.json](https://github.com/sharevb/it-tools/blob/main/package.json)
    फ़ाइल में देख सकते हैं।


    ## कोई बग मिला? कोई टूल गायब है?

    यदि आपको किसी ऐसे टूल की आवश्यकता है जो वर्तमान में यहाँ मौजूद नहीं है और
    आपको लगता है कि उपयोगी हो सकता है, तो आप GitHub रिपॉज़िटरी के [issues
    सेक्शन](https://github.com/sharevb/it-tools/issues/new/choose) में फ़ीचर
    अनुरोध सबमिट कर सकते हैं।


    और यदि आपको कोई बग मिला है, या कुछ अपेक्षा के अनुरूप काम नहीं कर रहा है, तो
    कृपया GitHub रिपॉज़िटरी के [issues
    सेक्शन](https://github.com/sharevb/it-tools/issues/new/choose) में बग
    रिपोर्ट दर्ज करें।

