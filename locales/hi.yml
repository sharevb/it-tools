        सकती हैं। अपनी प्रविष्टियों को अल्पविराम, रिक्त स्थान या अर्धविराम से
        अलग करें।
      tag-note-2: "टिप्पणी 2:"
      tag-nbsp-when-you-specify-a-source-src-or-destination-dst-flags-tcpdump-will-only-filter-in-that-direction-if-you-are-looking-to-capture-full-tcp-handshake-make-sure-you-use-host-vs-src-host-or-dst-host-to-see-both-request-and-response-flow:
        जब आप स्रोत (src) या गंतव्य (dst) फ़्लैग निर्दिष्ट करते हैं, तो tcpdump
        केवल उसी दिशा में फ़िल्टर करेगा। यदि आप संपूर्ण TCP हैंडशेक को कैप्चर
        करना चाहते हैं, तो अनुरोध और प्रतिक्रिया प्रवाह दोनों को देखने के लिए
        "src host" या "dst host" के बजाय "host" का उपयोग करना सुनिश्चित करें।
      tag-the-network-interface-to-capture-packets-from: पैकेट कैप्चर करने के लिए नेटवर्क इंटरफ़ेस।
      tag-capture-packets-originating-from-this-host: इस होस्ट से उत्पन्न होने वाले पैकेटों को कैप्चर करें।
      tag-capture-packets-destined-for-this-host: इस होस्ट के लिए भेजे गए पैकेटों को कैप्चर करें।
      tag-filter-packets-from-this-source-port: इस स्रोत पोर्ट से आने वाले पैकेटों को फ़िल्टर करें।
      tag-filter-packets-going-to-this-destination-port: इस गंतव्य पोर्ट पर जाने वाले पैकेटों को फ़िल्टर करें।
      tag-stop-capturing-after-this-number-of-packets: इतने पैकेटों के बाद कैप्चर करना बंद कर दें।
      tag-n: -एन
      tag-prevent-resolving-ips-to-hostnames: आईपी पते को होस्टनाम में परिवर्तित होने से रोकें।
