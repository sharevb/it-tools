        once-the-long-break-is-finished-return-to-step-1: लंबी छुट्टी समाप्त होने के बाद, चरण 1 पर वापस लौटें।
        keep-repeating-steps-1-3-but-after-your-4th-task-take-a-long-break-instead-of-a-short-break-20-30-minutes-is-common:
          चरण 1-3 को दोहराते रहें, लेकिन अपने चौथे कार्य के बाद, छोटे ब्रेक के
          बजाय लंबा ब्रेक लें (20-30 मिनट का ब्रेक आम तौर पर लिया जाता है)।
        when-the-timer-rings-take-a-short-break-5-10-minutes-is-common:
          जब टाइमर बजे, तो थोड़ी देर का ब्रेक लें (आमतौर पर 5-10 मिनट का ब्रेक
          लिया जाता है)।
        work-on-the-task-during-that-time: उस दौरान उस कार्य पर काम करें।
        decide-on-a-task-and-set-the-timer-25-minutes-is-common: एक कार्य का चयन करें और
          टाइमर सेट करें (आमतौर पर 25 मिनट का समय निर्धारित किया जाता है)।
        five-steps-of-the-pomodoro-technique: पोमोडोरो तकनीक के पाँच चरण
        the-pomodoro-technique-is-a-time-management-method-developed-by-francesco-cirillo-in-the-1980s-it-uses-a-timer-to-break-work-into-intervals-typically-25-minutes-in-length-separated-by-short-breaks-each-interval-is-known-as-a-pomodoro-from-the-italian-word-for-tomato-after-the-tomato-shaped-kitchen-timer-cirillo-used-as-a-university-student:
          पोमोडोरो तकनीक एक समय प्रबंधन विधि है जिसे फ्रांसेस्को सिरिलो ने 1980
          के दशक में विकसित किया था। इसमें टाइमर का उपयोग करके काम को अंतरालों
          में विभाजित किया जाता है, जो आमतौर पर 25 मिनट के होते हैं और इनके बीच
          छोटे-छोटे ब्रेक होते हैं। प्रत्येक अंतराल को पोमोडोरो कहा जाता है, जो
          टमाटर के लिए इतालवी शब्द से लिया गया है, क्योंकि सिरिलो ने
          विश्वविद्यालय के छात्र के रूप में टमाटर के आकार के किचन टाइमर का उपयोग
          किया था।
