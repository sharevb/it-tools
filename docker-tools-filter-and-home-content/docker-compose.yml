services:
  it-tools:
    image: sharevb/it-tools:latest@sha256:d08fa3dece36b1eb54de1a6b8433a8380b75a00a7ed47d5082e9974df53bb06d
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ./tools-filter.json:/usr/share/nginx/html/tools-filter.json
      - ./external-tools.json:/usr/share/nginx/html/external-tools.json
      - ./home.custom.md:/usr/share/nginx/html/home.custom.md
    ports:
      - 8080:8080