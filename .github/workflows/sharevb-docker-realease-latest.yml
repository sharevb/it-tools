name: Build and Push Docker Image (latest)

env:
  VITE_VERCEL_ENV: production

on:
  push:
    branches:
      - chore/all-my-stuffs

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v2.0.2
        with:
          cache: true

      - name: Run linters
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

      - name: Type check
        run: pnpm typecheck

      - name: Build the app
        run: pnpm build

  build:
    runs-on: ubuntu-latest
    needs:
      - ci
    strategy:
      matrix:
        language: ['', 'en']
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: sharevb/it-tools
          labels: |
            org.opencontainers.image.version=${{ case(matrix.language != '', format('latest-{0}', matrix.language), 'latest') }}

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            "BASE_URL=/"
            "VITE_AVAILABLE_LOCALES=${{ matrix.language }}"
            "VITE_LANGUAGE=${{ matrix.language }}"
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            sharevb/it-tools:${{ case(matrix.language != '', format('latest-{0}', matrix.language), 'latest') }}
            ghcr.io/sharevb/it-tools:${{ case(matrix.language != '', format('latest-{0}', matrix.language), 'latest') }}

      # Optionally log out
      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io