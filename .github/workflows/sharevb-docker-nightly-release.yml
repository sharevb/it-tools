name: Docker nightly release

env:
  VITE_VERCEL_ENV: production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check_date:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: test -z $(git rev-list  --after="24 hours"  ${{ github.sha }}) && echo "::set-output name=should_run::false"

  ci:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}

    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v2.0.2
        with:
          cache: true

      - name: Run linters
        run: pnpm lint

      - name: Run unit test
        run: pnpm test

      - name: Build the app
        run: pnpm build

  build:
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: sharevb/it-tools
          labels: |
            org.opencontainers.image.version=nightly

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            sharevb/it-tools:nightly
            ghcr.io/${{ github.repository_owner }}/it-tools:nightly

      # Optionally log out
      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io

  github-release:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Set release version to nightly
        run: echo "RELEASE_VERSION=nightly" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v2.0.2
        with:
          cache: true

      - name: Build the app
        run: pnpm build

      - name: Zip the app
        run: zip -r it-tools-${{ env.RELEASE_VERSION }}.zip dist/*

      - name: Get changelog
        id: changelog
        run: |
          EOF=$(openssl rand -hex 8)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          node ./scripts/getLatestChangelog.mjs >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: it-tools-${{ env.RELEASE_VERSION }}.zip
          tag_name: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: true
          body: |
            ## Docker images

            - Docker Hub Registry
              - `sharevb/it-tools:${{ env.RELEASE_VERSION}}`

            - GitHub Container Registry
              - `ghcr.io/sharevb/it-tools:${{ env.RELEASE_VERSION}}`

            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
