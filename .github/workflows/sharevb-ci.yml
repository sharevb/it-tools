name: ci

on:
  pull_request:
  push:
    branches:
      - chore/all-my-stuffs

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v2.0.2
        with:
          cache: true

      - name: Check formatting
        # Reported but not enforced: 832 of 1613 files predate oxfmt being run
        # in CI, so this fails today. Kept visible so the drift stays tracked
        # until a repo-wide reformat lands, then drop continue-on-error.
        continue-on-error: true
        run: pnpm fmt:check

      - name: Run linters
        run: pnpm lint

      - name: Run unit test
        run: pnpm test:unit

      - name: Type check
        run: pnpm typecheck

      - name: Build the app
        run: pnpm build
