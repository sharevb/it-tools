name: E2E tests
on:
  pull_request:
  push:
    branches:
      - chore/all-my-stuffs
jobs:
  test:
    name: test (${{ matrix.browser }})
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      # Always report every browser, rather than cancelling the rest on the
      # first failure.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v2.0.2
        with:
          cache: true

      - name: Get Playwright version
        id: playwright-version
        # The installed version, not the range in package.json: a lockfile bump
        # inside the same range would otherwise leave the key unchanged and the
        # cached browsers out of sync with Playwright.
        run: echo "PLAYWRIGHT_VERSION=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: pnpm build

      - name: Restore Playwright browsers from cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-${{ hashFiles('**/playwright.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-
            ${{ runner.os }}-playwright-${{ matrix.browser }}-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: pnpm run test:e2e --project=${{ matrix.browser }}
