name: Release new versions

env:
  VITE_VERCEL_ENV: production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker-release:
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: sharevb/it-tools

      - name: Get release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push (BASE_URL)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            "BASE_URL=/it-tools/"
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            sharevb/it-tools:baseurl-it-tools
            sharevb/it-tools:stable-baseurl-it-tools
            sharevb/it-tools:${{ env.RELEASE_VERSION}}-baseurl-it-tools
            ghcr.io/sharevb/it-tools:baseurl-it-tools
            ghcr.io/sharevb/it-tools:stable-baseurl-it-tools
            ghcr.io/sharevb/it-tools:${{ env.RELEASE_VERSION}}-baseurl-it-tools

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            sharevb/it-tools:latest
            sharevb/it-tools:stable
            sharevb/it-tools:${{ env.RELEASE_VERSION}}
            ghcr.io/sharevb/it-tools:latest
            ghcr.io/sharevb/it-tools:stable
            ghcr.io/sharevb/it-tools:${{ env.RELEASE_VERSION}}

  github-release:
    runs-on: ubuntu-latest
    needs: docker-release
    steps:
      - name: Get release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm and install dependencies
        uses: pnpm/setup@v2.0.2
        with:
          cache: true

      - name: Build the app
        run: pnpm build

      - name: Zip the app
        run: zip -r it-tools-${{ env.RELEASE_VERSION }}.zip dist/*

      - name: Get changelog
        id: changelog
        run: |
          EOF=$(openssl rand -hex 8)
          echo "changelog<<$EOF" >> $GITHUB_OUTPUT
          node ./scripts/getLatestChangelog.mjs >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: it-tools-${{ env.RELEASE_VERSION }}.zip
          tag_name: v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          make_latest: "true"
          body: |
            ## Docker images

            - Docker Hub Registry
              - `sharevb/it-tools:latest`
              - `sharevb/it-tools:stable`
              - `sharevb/it-tools:${{ env.RELEASE_VERSION}}`

            - GitHub Container Registry
              - `ghcr.io/sharevb/it-tools:latest`
              - `ghcr.io/sharevb/it-tools:stable`
              - `ghcr.io/sharevb/it-tools:${{ env.RELEASE_VERSION}}`

            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
