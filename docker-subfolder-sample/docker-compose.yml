services:
  it-tools:
    container_name: it-tools-subfolder
    image: ghcr.io/sharevb/it-tools:baseurl-it-tools@sha256:794b1d22f04bf597e6d9c41914a4dbd8bc3a60862e323329e84932bc7864b2b5
    pull_policy: always
    restart: unless-stopped
  nginx-reverse-proxy:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    depends_on:
      - it-tools
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf"
    ports:
      - 80:80